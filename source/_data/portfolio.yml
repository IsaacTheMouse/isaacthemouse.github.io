- id: graduation-shooter
  title: 未命名项目
  year: 2025
  sort_date: '2025-03-01'
  period: 2025 年 3～5 月
  status: completed
  engines:
    - Godot
  roles:
    - SOLO
  types:
    - graduation-project
    - solo
  event: 毕业设计项目
  summary: 一个拥有基础 NPC AI、以目标点争夺为核心的俯视角射击游戏。
  cover: /portfolio/assets/ef77f0cb473465d29b9aa3bf23d4d09a.webp
  game_content: |
    我的毕业设计项目，一个拥有基础 NPC AI 的俯视角射击游戏。玩家通过与 AI 队友协同，对抗敌人，占领目标点并不断推进以获得胜利。
  work_content: |
    实现了俯视角射击的核心 3C 系统：

    - 实现角色移动、瞄准与射击等基础控制逻辑；
    - 实现了两种武器（半自动手枪、全自动冲锋枪）及对应的射击模式。

    设计并实现了一套基于有限状态机的 NPC 行为系统：状态由巡逻、接敌、前进构成，根据视野中是否有敌人、目标点状态等条件进行切换。结合 Godot 内置的 A*2D 寻路类，实现了动态地形感知等寻路功能。

    构建了一个以目标点为核心的关卡系统。地图中布置有多个可占领的据点，作为战斗的阶段性目标，玩家需与 AI 队友协同，占领据点并逐步推进至下一区域。据点会根据范围内敌我单位数量累计控制权，当控制权切换时，通过信号通知管理器进行处理。

    这些系统的各个组件中，自下而上的部分通过 Godot 内置的信号系统进行通信，自上而下则是直接进行方法调用。这使得脚本间拥有较低的耦合度和良好的扩展性，无论拥有多少个 NPC 或据点实例，上层的管理器脚本都能对其进行有效管理。

    ![该项目的引擎内截图](/portfolio/assets/ef77f0cb473465d29b9aa3bf23d4d09a.webp)

- id: equal-to-p
  title: Equal to P
  year: 2024
  sort_date: '2024-01-26'
  period: 2024 年 1 月 26～28 日
  status: completed
  engines:
    - Godot
  roles:
    - 美术
  types:
    - game-jam
    - team
  event: Global Game Jam 2024 深圳凉屋站线下合作作品
  award: 站点人气投票第一名
  summary: 一款由布尔代数和颜文字启发、需要构造恒真表达式的逻辑解谜游戏。
  cover: /portfolio/assets/8a696b3e101fb65cba96c6fdeb58c779.webp
  game_content: |
    一款由布尔代数和颜文字启发的逻辑解谜游戏，（GameJam 版）有 5 个章节、23+ 关卡。玩家通过在给定的算式中填入不同元素，让表达式恒为真的同时，使式子的某个部分能够构成笑脸颜文字。
  work_content: |
    除了一部分纸面上的策划工作，我主要负责视觉概念设计和美术资产的产出。

    ![游戏第一关的截图，背景中的颜文字除了作为装饰，也用于提示玩家通关条件](/portfolio/assets/9e40ccc68b8f63bab8955953c3c5b682.webp)

    基于“布尔逻辑”这一抽象概念，结合笑脸颜文字，设计了具象化的视觉符号，并为项目规定了不同状态所对应的美术表达（颜色、形态等），以配合无文字引导。

    结合像素画工具 Aseprite，在引擎中使用 TileSet 完成了一套像素 Sprite，使用引擎的 UI 工具搭建了配套的 UI 和主界面，并通过 Git 与其他成员进行合作开发。

    我在结束开发后制作了一支宣传视频，该视频已在 B 站获得 4 万播放量。

    ![为该项目制作的 SpriteSheet](/portfolio/assets/4a4c1d9562dfa02a5cb90f2bac6c8b71.webp)
