  event: CiGA Game Jam 2025 沈阳站线下合作作品
  summary: 一款使用胶卷相机和闪光灯探索闹鬼庄园、还原人物身份的推理游戏。
  cover: /portfolio/assets/4082ad8fa151076762976512e28fea5f.webp
  game_content: |
    讲述了一位神父前往闹鬼的庄园，使用胶卷相机和闪光灯进行除灵的故事。

    因遭到诅咒，这个庄园中居住的领主一家主仆全部变成了会说话的家具，并且遗忘了自己的身份和经历。玩家需要通过对话和探索不断收集信息，一步一步地还原他们的遭遇，拼凑出每个人的身份，最终找出他们被诅咒的原因，然后将他们一一超度。
  work_content: |
    通过模仿《奥伯拉丁的归来》《无人在线》两款游戏，设计一个基于人际关系的推理剧本，填充人物的性格、人际关系等。

    和其他成员协作，参考游戏《TOEM》，使用 Unity 设计并实现了一个 2D / 3D 混合的场景。其中，无法互动的场景物体使用 3D 建模，可以互动的则是始终面朝玩家相机的 2D 物体。

    通过该设计，降低了程序和美术的工作量，使得 UI 和实际游玩场景中的素材可复用，同时也使得玩家一眼就能认出场景中的可互动元素。

    ![开发过程中的场景截图](/portfolio/assets/b2c89f82f6464f3129d75db11b8e0c8d.webp)

    ![拍照 UI](/portfolio/assets/1e6d93248ff88568932b9d2129397b4f.webp)

- id: wake-up
  title: All you have to do is wake up
  year: 2024
  sort_date: '2024-11-22'
  period: 2024 年 11 月 22 日～12 月 1 日
  status: completed
  engines:
    - Unity
  roles:
    - 策划
    - 队长
  types:
    - game-jam
    - team
  event: 2024 吉比特高校 GameJam 挑战赛线上合作作品
  summary: 一款以梦境与死亡为主题、以多世界切换为主要玩法的平台解谜游戏。
  cover: /portfolio/assets/9109f023baecd5c5fcf0e6a8d4cab398.webp
  game_content: |
    致敬电影《盗梦空间》，一款以“梦境与死亡”为主题、多世界切换为主要玩法的平台解谜游戏。
  work_content: |
    使用三种直观的机制（锁钥、推箱、尖刺）与游戏的主要机制（多世界切换）构筑了 7 个精致的关卡，机制两两之间都能达到有机联动，并通过关卡设计为每个机制都建立了有效的引导。

    使用了树状图进行关卡管理，不仅能提供更清晰的关卡关系，也有助于清晰的引导设计及冗余关卡的剔除。

    在具体的关卡设计图中使用网格填色的方式，以期获得与程序端更方便快捷的协作效果。因程序实现使用了 TileMap，网格设计能与实际实现一一对应，使用不同颜色标识不同功能既能在设计阶段进行直观的验证，也方便程序进行地图摆放。

    ![树状关卡管理](/portfolio/assets/7b3b58f222727b6605e5a738535fdd2b.webp)

    ![关卡设计草稿](/portfolio/assets/762a086d411f279e7d5b1e2b0966d550.webp)
